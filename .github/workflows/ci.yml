name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-smoke:
    name: Backend smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
      redis-cache:
        image: redis:8-alpine
        ports:
          - 13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5
      redis-queue:
        image: redis:8-alpine
        ports:
          - 11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=5
    env:
      ADMIN_PASSWORD: admin
      BENCH_PATH: /home/runner/frappe-bench
      DB_ROOT_PASSWORD: root
      SITE_NAME: test_site
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Bench
        run: python -m pip install frappe-bench
      - name: Initialize Bench
        run: |
          bench init \
            --frappe-branch version-16 \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(command -v python)" \
            "$BENCH_PATH"
          mysql --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" \
            -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -p"$DB_ROOT_PASSWORD" \
            -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
      - name: Install Service Hub System
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          bench get-app service_hub_system "$GITHUB_WORKSPACE"
          bench setup requirements
      - name: Create isolated site and run backend smoke
        working-directory: ${{ env.BENCH_PATH }}
        env:
          CI: "Yes"
        run: |
          bench new-site "$SITE_NAME" \
            --db-root-password "$DB_ROOT_PASSWORD" \
            --admin-password "$ADMIN_PASSWORD"
          bench --site "$SITE_NAME" install-app service_hub_system
          bench --site "$SITE_NAME" set-config allow_tests true
          bench --site "$SITE_NAME" run-tests --app service_hub_system

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test
      - name: Type-check frontend
        run: npm run type-check
      - name: Build frontend
        run: npm run build

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Ruff
        run: python -m pip install ruff==0.14.10
      - name: Lint Python package
        run: ruff check service_hub_system
      - name: Check Python formatting
        run: ruff format --check service_hub_system
